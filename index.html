<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Animado - A Nossa Atmosfera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slide-container">
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="content-layer">
      <header class="header">
        <span>Módulo 19 | Ciências – 7º Ano</span>
        <span>A Nossa Atmosfera</span>
      </header>

      <main class="main-body">
        <div class="left-col">
          <h1>O ar é uma coisa só?</h1>
          <p class="description">
            O ar que nos cerca não é formado por um único gás, mas por uma mistura de diferentes gases.
          </p>
          <div class="question-box">
            <svg viewBox="0 0 24 24">
              <path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.156 20.206 10.231 17.9001 10.024C17.4331 6.588 14.5029 4 11 4C7.7978 4 5.07475 6.1388 4.28822 9.155C2.40828 9.7712 1 11.5316 1 13.625C1 16.3174 3.1826 18.5 5.875 18.5H6.5" />
            </svg>
            <span>Quais gases estamos respirando agora?</span>
          </div>
        </div>

        <div class="right-annotation">
          <p class="handwritten-text">
            Uma camada de gases que torna a vida possível!
          </p>
          <svg class="arrow-svg" viewBox="0 0 50 50">
            <path d="M 10 10 Q 30 15 25 40" />
            <path d="M 18 35 L 25 40 L 30 32" />
          </svg>
        </div>
      </main>

      <footer class="footer-icons">
        <div class="icon-item">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 5-4 9-10 9z" />
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
          </svg>
          <span class="icon-label">Sustenta<br>a Vida</span>
        </div>

        <div class="icon-item">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M2 8h16a3 3 0 0 0 0-6 3 3 0 0 0-3 3" />
            <path d="M2 14h12a3 3 0 0 0 0-6 3 3 0 0 0-3 3" />
            <path d="M2 20h18a2 2 0 0 0 0-4 2 2 0 0 0-2 2" />
          </svg>
          <span class="icon-label">Regula<br>o Clima</span>
        </div>

        <div class="icon-item">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span class="icon-label">Nos<br>Protege</span>
        </div>
      </footer>
    </div>
  </div>

</body>
</html>
